name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'

    - name: Build
      run: |
        go build -v ./cmd/gateway
        go build -v ./cmd/orchestrator
        go build -v ./cmd/proxy

    - name: Test
      run: go test -v ./...

    - name: Install and run golangci-lint
      run: |
        go install github.com/golangci/golangci-lint/cmd/golangci-lint@master
        $(go env GOPATH)/bin/golangci-lint run
