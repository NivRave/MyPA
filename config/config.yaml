# MyPA Default Configuration
# Secrets should be set via environment variables (see .env.example)

server:
  port: 8000 # the app's one HTTP port (V4-01); HTTP_PORT overrides it

google:
  client_id: ""
  client_secret: ""
  # No redirect_url: it is derived from PUBLIC_URL (V4-40), or the app's local port without one.

tavily:
  api_key: ""

# The chat model is not set here. Its default is defined once, in code
# (config.DefaultGeminiModel); override it per install with GEMINI_MODEL.

encryption:
  key: "" # Supplied via ENCRYPTION_KEY environment variable

# Channel settings are read by the channel adapters from the environment only (V4-31);
# see .env.example.
