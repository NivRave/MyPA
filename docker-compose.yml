# P3-3: bounded container logs for every service (json-file, 5 x 10 MB)
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # V4-40: the same file runs a home PC or a server; settings in .env choose, never edits here.
  #   - How the install is reached: INGRESS and PUBLIC_URL. The bundled tunnel or proxy of each
  #     ingress is the service, and the compose profile, of the same name (ngrok, cloudflare,
  #     tailscale, caddy), started by COMPOSE_PROFILES. INGRESS=none starts none of them.
  #   - Managed services: EXTERNAL_DATABASE_URL, EXTERNAL_REDIS_URL and EXTERNAL_RABBITMQ_URL replace
  #     the bundled containers' addresses. Unset, the containers below are used.

  # V4-01: the app is one binary with roles (ADR 0001 option 1c). It runs the default role, `all`:
  # it receives the webhooks, enqueues them on RabbitMQ (the durable hand-off is kept), consumes
  # them, and serves /graphql and the Google sign-in on the same port. `--role=ingress` and
  # `--role=worker` split it again when a deploy needs that.
  app:
    logging: *default-logging
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      - RABBITMQ_URL=${EXTERNAL_RABBITMQ_URL:-amqp://${RABBITMQ_DEFAULT_USER:-mypa}:${RABBITMQ_DEFAULT_PASS:-mypa_dev}@rabbitmq:5672/}
      - REDIS_URL=${EXTERNAL_REDIS_URL:-redis://redis:6379/0}
      - DATABASE_URL=${EXTERNAL_DATABASE_URL:-postgres://${POSTGRES_USER:-mypa}:${POSTGRES_PASSWORD:-mypa_password}@postgres:5432/${POSTGRES_DB:-mypa}?sslmode=disable}
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./backups:/backups
      # V4-43: a backup is the database dump plus the archive files. Read-only: the audit worker
      # is the only writer.
      - audit_archives:/app/archives:ro
    restart: unless-stopped

  # V4-43: the restore-and-migrate tool (docs/RESTORE_AND_MIGRATE.md). Never started by `up`.
  # Run it next to a STOPPED app, with the infrastructure running:
  #   docker compose --profile tools run --rm transfer export
  #   docker compose --profile tools run --rm transfer import backup_<time>.manifest.json
  transfer:
    logging: *default-logging
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    entrypoint: ["/usr/local/bin/mypa", "transfer"]
    env_file:
      - .env
    environment:
      - RABBITMQ_URL=${EXTERNAL_RABBITMQ_URL:-amqp://${RABBITMQ_DEFAULT_USER:-mypa}:${RABBITMQ_DEFAULT_PASS:-mypa_dev}@rabbitmq:5672/}
      - REDIS_URL=${EXTERNAL_REDIS_URL:-redis://redis:6379/0}
      - DATABASE_URL=${EXTERNAL_DATABASE_URL:-postgres://${POSTGRES_USER:-mypa}:${POSTGRES_PASSWORD:-mypa_password}@postgres:5432/${POSTGRES_DB:-mypa}?sslmode=disable}
      - AUDIT_ARCHIVE_DIR=/app/archives
    volumes:
      - ./backups:/backups
      - audit_archives:/app/archives
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: "no"

  # P4-3: one-shot schema migration job. The app and audit-worker start only after it
  # completes successfully, and themselves refuse to run with pending migrations.
  migrate:
    logging: *default-logging
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    command: ["-migrate-only"]
    env_file:
      - .env
    environment:
      - RABBITMQ_URL=${EXTERNAL_RABBITMQ_URL:-amqp://${RABBITMQ_DEFAULT_USER:-mypa}:${RABBITMQ_DEFAULT_PASS:-mypa_dev}@rabbitmq:5672/}
      - REDIS_URL=${EXTERNAL_REDIS_URL:-redis://redis:6379/0}
      - DATABASE_URL=${EXTERNAL_DATABASE_URL:-postgres://${POSTGRES_USER:-mypa}:${POSTGRES_PASSWORD:-mypa_password}@postgres:5432/${POSTGRES_DB:-mypa}?sslmode=disable}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  audit-worker:
    logging: *default-logging
    build:
      context: .
      target: audit-worker
    env_file:
      - .env
    environment:
      - RABBITMQ_URL=${EXTERNAL_RABBITMQ_URL:-amqp://${RABBITMQ_DEFAULT_USER:-mypa}:${RABBITMQ_DEFAULT_PASS:-mypa_dev}@rabbitmq:5672/}
      - REDIS_URL=${EXTERNAL_REDIS_URL:-redis://redis:6379/0}
      - DATABASE_URL=${EXTERNAL_DATABASE_URL:-postgres://${POSTGRES_USER:-mypa}:${POSTGRES_PASSWORD:-mypa_password}@postgres:5432/${POSTGRES_DB:-mypa}?sslmode=disable}
      - AUDIT_ARCHIVE_DIR=/app/archives
    volumes:
      - audit_archives:/app/archives
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # V4-40: INGRESS=ngrok. Opt-in (COMPOSE_PROFILES=ngrok); the tunnel serves PUBLIC_URL.
  ngrok:
    logging: *default-logging
    profiles: ["ngrok"]
    # Pinned by digest (ngrok agent 3.39.8) — P3-5. Bump deliberately (Dependabot, P5-4).
    image: ngrok/ngrok:3.39.8@sha256:14d80d083e5b53145f416bbbd36238336c9de4016c43fd950eb2eb845670583b
    restart: unless-stopped
    command:
      - "http"
      - "app:8000"
      # P3-5: no committed default domain. Without PUBLIC_URL ngrok fails loudly at start
      # (a ${VAR:?} guard would break every compose command, incl. CI builds without a .env).
      - "--url=${PUBLIC_URL:-}"
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN:-}
    ports:
      - "127.0.0.1:4040:4040"
    depends_on:
      app:
        condition: service_started

  # V4-40: INGRESS=cloudflare. Opt-in (COMPOSE_PROFILES=cloudflare). The tunnel's public hostname
  # (PUBLIC_URL) and its target, http://app:8000, are set in the Cloudflare dashboard; the token
  # connects this container to that tunnel. Outbound only: no port is published.
  cloudflare:
    logging: *default-logging
    profiles: ["cloudflare"]
    # Pinned by digest (cloudflared 2026.11.1).
    image: cloudflare/cloudflared:2026.11.1@sha256:e613aadbc2d9511785d2e67a86b0c8ac18dd63a3f9af0d06faf04cbfdcb35f2d
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      app:
        condition: service_started

  # V4-40: INGRESS=tailscale. Opt-in (COMPOSE_PROFILES=tailscale). Joins the tailnet as
  # TAILSCALE_HOSTNAME and publishes the app with Funnel (deploy/tailscale-serve.json); PUBLIC_URL is
  # https://<TAILSCALE_HOSTNAME>.<tailnet>.ts.net. Outbound only: no port is published.
  tailscale:
    logging: *default-logging
    profiles: ["tailscale"]
    # Pinned by digest (Tailscale 1.104.7).
    image: tailscale/tailscale:v1.104.7@sha256:72c1e19e0aedca96b8533bbb0b4368564410ff20b17e53b804eb6c1f04a31be4
    restart: unless-stopped
    hostname: ${TAILSCALE_HOSTNAME:-mypa}
    environment:
      - TS_AUTHKEY=${TAILSCALE_AUTHKEY:-}
      - TS_HOSTNAME=${TAILSCALE_HOSTNAME:-mypa}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=true
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      - tailscale_state:/var/lib/tailscale
      - ./deploy/tailscale-serve.json:/config/serve.json:ro
    depends_on:
      app:
        condition: service_started

  # V4-40: INGRESS=caddy, the single-server path (DE-9). Opt-in (COMPOSE_PROFILES=caddy). Caddy
  # obtains and renews the TLS certificate for PUBLIC_URL's host and forwards to the app's port.
  # Host networking: it listens on the server's ports 80 and 443 itself and reaches the app on
  # 127.0.0.1:8000, so compose publishes nothing beyond loopback. For a Linux server; ports 80 and
  # 443 must reach the machine and the domain's DNS must point at it.
  caddy:
    logging: *default-logging
    profiles: ["caddy"]
    # Pinned by digest (Caddy 2.11.9).
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    restart: unless-stopped
    network_mode: host
    environment:
      - PUBLIC_URL=${PUBLIC_URL:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_started

  rabbitmq:
    logging: *default-logging
    image: rabbitmq:4.3.7-management-alpine@sha256:eb338b3fc8f5c251028c0022ac0de3fe1db2d599d1c6a08b45898f756f248881
    # Fixed hostname = stable node name (rabbit@rabbitmq). Without it the node name is the
    # container ID, so every recreate started an empty node and stranded queued/DLQ messages.
    hostname: rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-mypa}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-mypa_dev}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 5
    restart: unless-stopped

  redis:
    logging: *default-logging
    image: redis:8.10.3-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      start_period: 5s
      retries: 5
    restart: unless-stopped

  postgres:
    logging: *default-logging
    image: pgvector/pgvector:0.8.6-pg15@sha256:a947c45cdc5906a1bc951f20a8709e321256343ee0f251e4ae00b5e7def4e6da
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mypa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mypa_password}
      POSTGRES_DB: ${POSTGRES_DB:-mypa}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mypa} -d ${POSTGRES_DB:-mypa}"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 5
    restart: unless-stopped

  pgadmin:
    logging: *default-logging
    # P3-5: opt-in only — `docker compose --profile tools up -d pgadmin`.
    profiles: ["tools"]
    # Pinned by digest (pgAdmin 9.17).
    image: dpage/pgadmin4:9.17@sha256:2f4ce946ddf8360680d7eff4eaba1d91859eb6b4003e6623bad5c63a322c2f4d
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@mypa.com}
      # No default password: pgAdmin refuses to start without one.
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-}
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    logging: *default-logging
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3030:3000"
    environment:
      # V4-01: the dashboard talks to the app directly.
      - NEXT_PUBLIC_APP_URL=http://localhost:8000
      - GRAPHQL_ENDPOINT=http://app:8000/graphql
      - DASHBOARD_API_SECRET=${DASHBOARD_API_SECRET:-}
      # Must match the app's: the dashboard secret is scoped to this family group (P3-2)
      - DASHBOARD_FAMILY_GROUP=${DASHBOARD_FAMILY_GROUP:-}
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped

volumes:
  rabbitmq_data:
  redis_data:
  postgres_data:
  audit_archives:
  # V4-40: the bundled ingresses' state (Caddy's certificates, the Tailscale node key).
  caddy_data:
  caddy_config:
  tailscale_state:

