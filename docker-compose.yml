# P3-3: bounded container logs for every service (json-file, 5 x 10 MB)
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  gateway:
    logging: *default-logging
    build:
      context: .
      dockerfile: Dockerfile
      target: gateway
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    environment:
      - RABBITMQ_URL=amqp://${RABBITMQ_DEFAULT_USER:-mypa}:${RABBITMQ_DEFAULT_PASS:-mypa_dev}@rabbitmq:5672/
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgres://${POSTGRES_USER:-mypa}:${POSTGRES_PASSWORD:-mypa_password}@postgres:5432/${POSTGRES_DB:-mypa}?sslmode=disable
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  orchestrator:
    logging: *default-logging
    build:
      context: .
      dockerfile: Dockerfile
      target: orchestrator
    ports:
      - "127.0.0.1:8081:8081"
    env_file:
      - .env
    environment:
      - RABBITMQ_URL=amqp://${RABBITMQ_DEFAULT_USER:-mypa}:${RABBITMQ_DEFAULT_PASS:-mypa_dev}@rabbitmq:5672/
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgres://${POSTGRES_USER:-mypa}:${POSTGRES_PASSWORD:-mypa_password}@postgres:5432/${POSTGRES_DB:-mypa}?sslmode=disable
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./backups:/backups
    restart: unless-stopped

  # P4-3: one-shot schema migration job. The orchestrator and audit-worker start only after it
  # completes successfully, and themselves refuse to run with pending migrations.
  migrate:
    logging: *default-logging
    build:
      context: .
      dockerfile: Dockerfile
      target: orchestrator
    command: ["-migrate-only"]
    env_file:
      - .env
    environment:
      - RABBITMQ_URL=amqp://${RABBITMQ_DEFAULT_USER:-mypa}:${RABBITMQ_DEFAULT_PASS:-mypa_dev}@rabbitmq:5672/
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgres://${POSTGRES_USER:-mypa}:${POSTGRES_PASSWORD:-mypa_password}@postgres:5432/${POSTGRES_DB:-mypa}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  audit-worker:
    logging: *default-logging
    build:
      context: .
      target: audit-worker
    env_file:
      - .env
    environment:
      - RABBITMQ_URL=amqp://${RABBITMQ_DEFAULT_USER:-mypa}:${RABBITMQ_DEFAULT_PASS:-mypa_dev}@rabbitmq:5672/
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgres://${POSTGRES_USER:-mypa}:${POSTGRES_PASSWORD:-mypa_password}@postgres:5432/${POSTGRES_DB:-mypa}?sslmode=disable
      - AUDIT_ARCHIVE_DIR=/app/archives
    volumes:
      - audit_archives:/app/archives
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  proxy:
    logging: *default-logging
    build:
      context: .
      dockerfile: Dockerfile
      target: proxy
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - GATEWAY_URL=http://gateway:8080
      - ORCHESTRATOR_URL=http://orchestrator:8081
    depends_on:
      gateway:
        condition: service_started
      orchestrator:
        condition: service_started
    restart: unless-stopped

  ngrok:
    logging: *default-logging
    # Pinned by digest (ngrok agent 3.39.8) — P3-5. Bump deliberately (Dependabot, P5-4).
    image: ngrok/ngrok:3.39.8@sha256:14d80d083e5b53145f416bbbd36238336c9de4016c43fd950eb2eb845670583b
    restart: unless-stopped
    command:
      - "http"
      - "proxy:8000"
      # P3-5: no committed default domain. Without NGROK_DOMAIN ngrok fails loudly at start
      # (a ${VAR:?} guard would break every compose command, incl. CI builds without a .env).
      - "--url=${NGROK_DOMAIN:-}"
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    ports:
      - "127.0.0.1:4040:4040"
    depends_on:
      proxy:
        condition: service_started


  rabbitmq:
    logging: *default-logging
    image: rabbitmq:4.3.7-management-alpine@sha256:eb338b3fc8f5c251028c0022ac0de3fe1db2d599d1c6a08b45898f756f248881
    # Fixed hostname = stable node name (rabbit@rabbitmq). Without it the node name is the
    # container ID, so every recreate started an empty node and stranded queued/DLQ messages.
    hostname: rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-mypa}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-mypa_dev}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 5
    restart: unless-stopped

  redis:
    logging: *default-logging
    image: redis:7.4.11-alpine@sha256:d9436322172a5b482c187bf1f363d3c4fea086fcca6b9c8a94de8f0f39ed3193
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      start_period: 5s
      retries: 5
    restart: unless-stopped

  postgres:
    logging: *default-logging
    image: pgvector/pgvector:0.8.7-pg15@sha256:e0b617fffc06dd37323ee99873c7a8683f19f1dce34633670262b0113ce32638
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mypa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mypa_password}
      POSTGRES_DB: ${POSTGRES_DB:-mypa}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mypa} -d ${POSTGRES_DB:-mypa}"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 5
    restart: unless-stopped

  pgadmin:
    logging: *default-logging
    # P3-5: opt-in only — `docker compose --profile tools up -d pgadmin`.
    profiles: ["tools"]
    # Pinned by digest (pgAdmin 9.17).
    image: dpage/pgadmin4:9.17@sha256:2f4ce946ddf8360680d7eff4eaba1d91859eb6b4003e6623bad5c63a322c2f4d
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@mypa.com}
      # No default password: pgAdmin refuses to start without one.
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-}
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    logging: *default-logging
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3030:3000"
    environment:
      - NEXT_PUBLIC_PROXY_URL=http://localhost:8000
      - GRAPHQL_ENDPOINT=http://proxy:8000/graphql
      - DASHBOARD_API_SECRET=${DASHBOARD_API_SECRET:-}
      # Must match the orchestrator's: the dashboard secret is scoped to this family group (P3-2)
      - DASHBOARD_FAMILY_GROUP=${DASHBOARD_FAMILY_GROUP:-}
    depends_on:
      proxy:
        condition: service_started
    restart: unless-stopped

volumes:
  rabbitmq_data:
  redis_data:
  postgres_data:
  audit_archives:

